name: po0 防火墙自动加白
description: 调用 po0 防火墙 API 将本机当前出口 IP 加入白名单。支持多 token（英文逗号分割，一台机器一个），每 10 分钟 cron 与网络变化时自动加白。加白 API 走直连。可选：token 后加 @槽位（如 pgnfw_xxx@0）钉固定坑位、永不被淘汰。集成 iOS 原生桌面与锁定屏幕小组件。
author: reallinzc
homepage: https://github.com/w0ven/po0fw
icon: "sf-symbol:shield.checkerboard"

# 模块环境设置项（在 Egern 模块设置页自动生成图形化配置输入框）
env_schema:
  tokens:
    name: "防火墙 Tokens"
    description: "填入 po0 防火墙 Token (pgnfw_xxx)，多个以英文逗号分割。支持 @槽位 (如 pgnfw_xxx@0)"
    default_value: ""

# 兼容旧版参数替换宏语法（{{{tokens}}}）
compat_arguments:
  tokens: ""

# 加白 API 必须直连，确保服务端看到的是本机真实出口 IP 而不是代理出口
rules:
  - ip_cidr:
      match: 124.221.69.228/32
      policy: DIRECT
      no_resolve: true

scriptings:
  - schedule:
      name: po0-fw-cron
      cron: "*/10 * * * *"
      script_url: https://raw.githubusercontent.com/ClaraCora/ege/refs/heads/main/po0-e/po0-firewall-whitelist.js
      timeout: 60
      env:
        tokens: "{{{tokens}}}"
  - network:
      name: po0-fw-network
      script_url: https://raw.githubusercontent.com/ClaraCora/ege/refs/heads/main/po0-e/po0-firewall-whitelist.js
      timeout: 60
      env:
        tokens: "{{{tokens}}}"
  - generic:
      name: po0-fw-widget
      script_url: https://raw.githubusercontent.com/ClaraCora/ege/refs/heads/main/po0-e/po0-firewall-whitelist.js
      timeout: 20
      env:
        tokens: "{{{tokens}}}"

widgets:
  - name: po0-fw-widget
    display_name: po0 防火墙
    description: 实时显示 po0 防火墙白名单状态、出口 IP 与槽位占用
    env:
      tokens: "{{{tokens}}}"
